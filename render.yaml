# Render Blueprint (not deployed automatically). Set the `sync: false` values in the
# Render dashboard. MongoDB is hosted on MongoDB Atlas; the frontend on Vercel.
services:
  - type: web
    name: prepai-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_SERVICE_TOKEN
        sync: false
      # Same setup as verified locally: Groq for chat, Gemini for embeddings
      # (Groq has no embeddings endpoint). Ollama needs a GPU host, so it is not used here.
      - key: AI_PROVIDER
        value: groq
      - key: API_KEY            # Groq API key
        sync: false
      - key: API_MODEL
        value: openai/gpt-oss-120b
      - key: API_REASONING_EFFORT
        value: low
      - key: EMBEDDING_PROVIDER
        value: api
      - key: EMBEDDING_API_PROVIDER
        value: gemini
      - key: EMBEDDING_API_KEY  # Gemini API key
        sync: false
      - key: API_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: VECTOR_STORE
        value: chroma
      # Free plan: no persistent disk. The index lives on the instance's ephemeral filesystem
      # (relative to rootDir) and is rebuilt automatically after every restart/spin-down (below).
      - key: VECTOR_DB_PATH
        value: ./data/vector_db
      # Rebuilds an empty index when this service starts (relative to rootDir). If the path is
      # missing the service logs a warning and the backend's startup sync remains the fallback.
      - key: RAG_BOOTSTRAP_DIR
        value: ../backend/src/seed/knowledge

  - type: web
    name: prepai-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET         # >= 32 random characters
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # The local process sandbox is refused in production; use a dedicated judge.
      - key: CODE_RUNNER
        value: disabled
